<app-page-header title="Themes" subtitle="Word sets you group your cards into.">
  <a class="btn btn-outline-secondary" routerLink="/cards">All cards</a>
  <a class="btn btn-primary" routerLink="/cards/new">New card</a>
</app-page-header>

<form class="surface theme-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="theme-form__field">
    <label class="visually-hidden" for="themeName">Theme name</label>
    <input
      id="themeName"
      class="form-control"
      type="text"
      formControlName="name"
      autocomplete="off"
      [class.is-invalid]="form.controls.name.invalid && (form.controls.name.touched || submitted())"
      [placeholder]="isEditing() ? 'Rename the theme' : 'Name a new theme'"
    />
    <app-field-error
      [control]="form.controls.name"
      label="The theme name"
      [submitted]="submitted()"
    />
  </div>

  <div class="theme-form__actions">
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ isEditing() ? 'Save' : 'Add theme' }}
    </button>

    @if (isEditing()) {
      <button type="button" class="btn btn-ghost" (click)="resetForm()">Cancel</button>
      <button type="button" class="btn btn-ghost-danger" [disabled]="saving()" (click)="remove()">
        Delete
      </button>
    }
  </div>
</form>

@if (pageData().items.length) {
  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3" [class.is-loading]="loading()">
    @for (theme of pageData().items; track theme.id) {
      <div class="col">
        <article
          class="card card-interactive h-100 theme-card"
          [class.theme-card--editing]="editingId() === theme.id"
        >
          <div class="card-body">
            <span class="badge-soft">#{{ theme.id }}</span>
            <h2 class="theme-card__name">{{ theme.name }}</h2>
          </div>

          <div class="card-footer theme-card__actions">
            <a
              class="btn btn-sm btn-outline-secondary"
              routerLink="/cards"
              [queryParams]="{ thema: theme.id }"
            >
              Open
            </a>
            <button type="button" class="btn btn-sm btn-ghost" (click)="startEdit(theme)">
              Rename
            </button>
          </div>
        </article>
      </div>
    }
  </div>

  <app-pagination
    [page]="pageData().page"
    [size]="pageData().size"
    [total]="pageData().total"
    [totalPages]="pageData().totalPages"
    label="themes"
    (pageChange)="goToPage($event)"
  />
} @else if (!loading()) {
  <app-empty-state
    title="No themes yet"
    text="Add your first theme above — cards are grouped by theme."
  />
}
