<div class="modal-header">
  <h2 class="modal-title">Choose themes</h2>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
</div>

<div class="modal-body">
  @if (pageData().items.length) {
    <ul class="thema-list" [class.is-loading]="loading()">
      @for (thema of pageData().items; track thema.id) {
        <li>
          <label class="thema-option">
            <input
              class="form-check-input"
              type="checkbox"
              [checked]="isSelected(thema)"
              (change)="toggle(thema, $event)"
            />
            <span>{{ thema.name }}</span>
          </label>
        </li>
      }
    </ul>

    <app-pagination
      [page]="pageData().page"
      [size]="pageData().size"
      [total]="pageData().total"
      [totalPages]="pageData().totalPages"
      label="themes"
      (pageChange)="load($event)"
    />
  } @else if (!loading()) {
    <p class="text-body-secondary mb-0">There are no themes yet.</p>
  }
</div>

<div class="modal-footer">
  <span class="me-auto text-body-secondary small">{{ selection().length }} selected</span>
  <button type="button" class="btn btn-ghost" (click)="modal.dismiss()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="modal.close(selection())">Done</button>
</div>
