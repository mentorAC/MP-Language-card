<app-page-header
  [title]="isEditing() ? 'Edit card' : 'New card'"
  subtitle="A word, its translation and the themes it belongs to."
>
  <a class="btn btn-outline-secondary" routerLink="/thema">Back to themes</a>
</app-page-header>

<form class="card card-form" (ngSubmit)="save()">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="word">Word</label>
      <input
        id="word"
        name="word"
        class="form-control"
        autocomplete="off"
        placeholder="The word you are learning"
        [(ngModel)]="card().word"
      />
    </div>

    <div class="row g-3">
      <div class="col-sm-6">
        <label class="form-label" for="translate">Translation</label>
        <input
          id="translate"
          name="translate"
          class="form-control"
          autocomplete="off"
          placeholder="What it means"
          [(ngModel)]="card().transWord"
        />
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="plural">Plural</label>
        <input
          id="plural"
          name="plural"
          class="form-control"
          autocomplete="off"
          placeholder="Plural form, if there is one"
          [(ngModel)]="card().plural"
        />
      </div>
    </div>

    <hr class="my-4" />

    <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
      <span class="form-label mb-0">Themes</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="openThemaPicker()">
        Choose themes
      </button>
    </div>

    @if (selectedThemas().length) {
      <ul class="thema-chips">
        @for (thema of selectedThemas(); track thema.id) {
          <li class="thema-chip">
            {{ thema.name }}
            <button
              type="button"
              class="thema-chip__remove"
              [attr.aria-label]="'Remove ' + thema.name"
              (click)="removeThema(thema.id)"
            >
              &times;
            </button>
          </li>
        }
      </ul>
    } @else {
      <p class="form-text mb-0">No themes chosen yet.</p>
    }
  </div>

  <div class="card-footer form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="!card().word.trim()">
      {{ isEditing() ? 'Save changes' : 'Create card' }}
    </button>
    <a class="btn btn-ghost" routerLink="/thema">Cancel</a>

    @if (isEditing()) {
      <button type="button" class="btn btn-ghost-danger ms-auto" (click)="remove()">Delete</button>
    }
  </div>
</form>
