<app-page-header
  [title]="card()?.word || 'Edit card'"
  subtitle="A word, its translation and the themes it belongs to."
>
  <a class="btn btn-outline-secondary" routerLink="/cards">All cards</a>
  <a class="btn btn-primary" routerLink="/cards/new">New card</a>
</app-page-header>

@if (card(); as loaded) {
  <app-card-form
    [card]="loaded"
    [saving]="saving()"
    [deletable]="true"
    submitLabel="Save changes"
    (save)="save($event)"
    (remove)="remove()"
  />
} @else if (loading()) {
  <p class="text-body-secondary">Loading the card…</p>
}
