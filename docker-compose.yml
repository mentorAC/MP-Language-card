name: mp-language-card

networks:
  # shared network with the reverse proxy and the postgres container
  infra:
    external: true

services:
  mp-language-card-app:
    image: mp-language-card-app
    container_name: mp-language-card-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
  
    environment:
      SERVER_PORT: 8080
      LOG_FORMAT: ${LOG_FORMAT:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-laguagecarddb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    expose:
      - 8080
    networks:
      infra:
        aliases:
          - mp-language-card
          - mp-language-card-app
