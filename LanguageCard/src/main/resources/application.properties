spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:laguagecarddb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgrespw}

server.port=${SERVER_PORT:8080}
# trust X-Forwarded-* from the gateway, so the app knows it is reached over https;
# without it Origin looks cross-site and module scripts get rejected with 403
server.forward-headers-strategy=framework

server.error.include-message=always
server.error.include-binding-errors=always

# structured (JSON) console logs when LOG_FORMAT is set - the log shipper on the
# server parses them into Loki labels; empty (local dev) keeps the plain format
logging.structured.format.console=${LOG_FORMAT:}
