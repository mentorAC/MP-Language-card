name: CI/CD Deploy to VPS

on:
  push:
    branches: [deploy]
  workflow_dispatch:

env:
  APP_DIR: mp-language-card

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Check required configuration
      env:
        VPS_USER: ${{ vars.VPS_USER }}
        VPS_HOST: ${{ vars.VPS_HOST }}
        POSTGRES_USER: ${{ vars.POSTGRES_USER }}
        POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
        VPS_KEY: ${{ secrets.VPS_KEY }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      run: |
        missing=()
        for name in VPS_USER VPS_HOST POSTGRES_USER POSTGRES_DB POSTGRES_HOST; do
          [ -n "${!name}" ] || missing+=("variable $name")
        done
        for name in VPS_KEY POSTGRES_PASSWORD; do
          [ -n "${!name}" ] || missing+=("secret $name")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing configuration:"
          for item in "${missing[@]}"; do echo "  - $item"; done
          echo "Add them under Settings -> Secrets and variables -> Actions."
          exit 1
        fi
        echo "All required variables and secrets are set."

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.VPS_KEY }}

    - name: Add VPS to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

    - name: Create env file
      run: |
        cat <<EOF > .env
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_USER=${{ vars.POSTGRES_USER }}
        POSTGRES_DB=${{ vars.POSTGRES_DB }}
        POSTGRES_HOST=${{ vars.POSTGRES_HOST }}
        POSTGRES_PORT=${{ vars.POSTGRES_PORT || '5432' }}
        EOF

    - name: Build Docker image
      run: docker compose -f docker-compose.yml build --pull

    - name: Save Docker image as tar
      run: |
        mkdir -p images
        docker save mp-language-card-app | gzip > images/mp-language-card-app.tar.gz

    - name: Copy image and docker-compose to VPS
      run: |
        ssh "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
          "mkdir -p ~/$APP_DIR"

        scp images/*.tar.gz \
          "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/tmp/"

        scp docker-compose.yml .env \
          "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:~/$APP_DIR/"

    - name: Deploy on VPS
      run: |
        ssh "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            APP_DIR="$APP_DIR" 'bash -se' <<'EOF'
          set -euo pipefail

          echo "Loading Docker image..."
          for img in /tmp/*.tar.gz; do
            gunzip -c "$img" | docker load
            rm -f "$img"
          done

          echo "Starting container..."
          cd "$HOME/$APP_DIR"
          docker compose up -d --remove-orphans

          echo "Cleaning up dangling images..."
          docker image prune -f
        EOF
